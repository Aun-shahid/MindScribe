[build]
builder = "dockerfile"
dockerfilePath = "Backend/Dockerfile"
context = "Backend"

[deploy]
# Default service role is web. For additional Railway services from same repo,
# set env var PROCESS_TYPE=worker or PROCESS_TYPE=beat.
startCommand = "/app/start.sh"
healthcheckPath = "/api/authenticator/health/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
maxRestartCount = 3
