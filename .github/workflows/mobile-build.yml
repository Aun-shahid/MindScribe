name: Mobile Build

on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/mobile/app.json'
      - 'Frontend/mobile/package.json'
      - 'Frontend/mobile/eas.json'
      - 'Frontend/mobile/app.config.js'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS profile to build
        required: true
        default: production
        type: choice
        options:
          - preview
          - production
      platform:
        description: Platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/mobile/package-lock.json

      - name: Detect Expo token
        id: expo_auth
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::EXPO_TOKEN is missing. Skipping mobile build for this run."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.expo_auth.outputs.has_token == 'true'
        run: npm ci

      - name: Install EAS CLI
        if: steps.expo_auth.outputs.has_token == 'true'
        run: npm install -g eas-cli

      - name: Resolve build params
        id: params
        if: steps.expo_auth.outputs.has_token == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
            echo "platform=${{ github.event.inputs.platform }}" >> $GITHUB_OUTPUT
          else
            echo "profile=production" >> $GITHUB_OUTPUT
            echo "platform=android" >> $GITHUB_OUTPUT
          fi

      - name: Trigger EAS build
        if: steps.expo_auth.outputs.has_token == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ${{ steps.params.outputs.platform }} \
            --profile ${{ steps.params.outputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Build skipped (missing token)
        if: steps.expo_auth.outputs.has_token != 'true'
        run: echo "Mobile build skipped because EXPO_TOKEN is not configured in repository secrets."
