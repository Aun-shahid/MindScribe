name: Mobile OTA Update

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'Frontend/mobile/**'
      - '.github/workflows/mobile-ota-update.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/mobile/package-lock.json

      - name: Validate Expo token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN secret is missing. Add it in GitHub repo secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Validate Expo config
        run: npx expo-doctor

      - name: Publish OTA update (dev -> preview)
        if: github.ref_name == 'dev'
        env:
          CI: '1'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --branch preview \
            --message "CI OTA: ${GITHUB_SHA}"

      - name: Publish OTA update (main -> production)
        if: github.ref_name == 'main'
        env:
          CI: '1'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --branch production \
            --message "CI OTA: ${GITHUB_SHA}"
