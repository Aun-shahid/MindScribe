name: Mobile OTA Update

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'Frontend/mobile/**'
      - '.github/workflows/mobile-ota-update.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/mobile/package-lock.json

      - name: Detect Expo token
        id: expo_auth
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::EXPO_TOKEN is missing. Skipping OTA publish for this run."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.expo_auth.outputs.has_token == 'true'
        run: npm ci

      - name: Install EAS CLI
        if: steps.expo_auth.outputs.has_token == 'true'
        run: npm install -g eas-cli

      - name: Validate Expo config
        if: steps.expo_auth.outputs.has_token == 'true'
        run: npx expo-doctor

      - name: Publish OTA update (dev -> preview)
        if: github.ref_name == 'dev' && steps.expo_auth.outputs.has_token == 'true'
        env:
          CI: '1'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --branch preview \
            --message "CI OTA: ${GITHUB_SHA}"

      - name: Publish OTA update (main -> production)
        if: github.ref_name == 'main' && steps.expo_auth.outputs.has_token == 'true'
        env:
          CI: '1'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --branch production \
            --message "CI OTA: ${GITHUB_SHA}"

      - name: OTA skipped (missing token)
        if: steps.expo_auth.outputs.has_token != 'true'
        run: echo "OTA publish skipped because EXPO_TOKEN is not configured."
